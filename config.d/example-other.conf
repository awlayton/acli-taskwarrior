# config.d/example-other.conf -- second-team template.
#
# Drop this file (or a copy) alongside example-team.conf under
# <hooks.location>/acli-sync/config.d/ (the bundle's own config.d/, the
# default the hooks read from on first install) to mirror a SECOND Jira
# account, filter, or project in the same Taskwarrior task list. Each
# file is its own whole config (defaults from set_config_defaults apply
# per-file), so an unset key here does NOT inherit from example-team.conf
# or any other sibling.
#
# Filename alphabetical order is the iteration order. Concatenate multiple
# teams by naming them 10-team-a.conf, 20-team-b.conf, etc., so the order
# is explicit.

# Use jql here (instead of a numeric saved filter) so the example shows
# both shapes the hookset supports.
jql="project = OTHER AND assignee = currentUser() ORDER BY updated DESC"

# Project for tasks mirrored from THIS config's snapshot. Tasks from
# example-team.conf keep their own project (alpha, etc.) - see README.
project=other

# UDA names (must match the uda.* lines in hooks/acli-sync/acli-sync.taskrc).
jira_key_uda=jirakey
jira_status_uda=jirastatus
jira_url_uda=jiraurl

# Status mapping: pipe-separated Jira status names that map to task states.
status_completed="Done|Closed|Resolved"        # -> task status completed
status_in_progress="In Progress|Review"        # -> task status pending
# Optional: mirrored in-progress tasks get this priority. Empty disables it.
priority_in_progress=H

# Push Taskwarrior changes back to Jira (on-modify hook). Last sourced
# config's values win for any push-time keys (complete_jira_status,
# sync_on_modify, etc.).
sync_on_modify=1
sync_description_on_modify=1
sync_labels_on_modify=0       # off by default to be safe
sync_description_on_launch=1  # 0 keeps locally-edited descriptions after a launch sync

complete_jira_status=Done     # status to set when task -> completed
reopen_jira_status=Backlog    # status to set when task -> pending (overridden)

acli_bin=acli                 # override if not on PATH
max_results=200               # --limit passed to acli
paginate=1                    # whether to pass --paginate
quiet=0                       # 1 silences non-error feedback

# Initialize a mirrored task's `entry` (and therefore its `age`) from
# the workitem's `created` timestamp.
init_age_from_jira=1
