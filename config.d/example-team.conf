# acli-sync configuration file (bash-sourceable KEY=VALUE).
#
# Place this file (or a copy) under <hooks.location>/acli-sync/config.d/.
# The hooks default to reading configs from the bundle's own config.d/
# directory - the same place bash install.bash copies the example
# configs to on first install. Set $ACLI_SYNC_CONFIG_DIR to point at a
# different directory if you want configs elsewhere.
#
# Each `*.conf` (or `*.bash`) file in config.d/ is loaded as a whole
# config; defaults are reapplied per file, so unset keys in this file do
# not leak values from a previous iteration. Files iterate in alphabetical
# order - prefix with a number (10-, 20-) for deterministic ordering.
#
# Multiple files = multiple Jira teams / accounts / filters mirrored side by
# side. See config.d/example-other.conf for a second-team template.

# EITHER filter (numeric saved filter ID) OR jql, not both. With multiple
# team configs in the directory, each file typically targets its own filter.
filter=23465
# jql=project = TEAM AND assignee = currentUser()

# Project assigned to mirrored tasks (optional; empty = no project).
project=acli

# UDA names (must match the uda.* lines in hooks/acli-sync/acli-sync.taskrc).
jira_key_uda=jirakey
jira_status_uda=jirastatus
jira_url_uda=jiraurl

# Status mapping: pipe-separated Jira status names that map to task states.
status_completed="Done|Closed|Resolved"        # -> task status completed
status_in_progress="In Progress|Review"        # -> task status pending
# Optional: mirrored in-progress tasks get this priority. Empty disables it.
priority_in_progress=H

# Push Taskwarrior changes back to Jira (on-modify hook).
sync_on_modify=1
sync_description_on_modify=1
sync_labels_on_modify=0       # off by default to be safe
sync_description_on_launch=1  # 0 keeps locally-edited descriptions after a launch sync

complete_jira_status=Done     # status to set when task -> completed
reopen_jira_status="To Do"    # status to set when task -> pending

acli_bin=acli                 # override if not on PATH
max_results=200               # --limit passed to acli
paginate=1                    # whether to pass --paginate
quiet=0                       # 1 silences non-error feedback

# Initialize a mirrored task's `entry` (and therefore its age) from the
# workitem's `created` timestamp rather than the import moment. Costs one
# extra `acli jira workitem view` call per new key per on-launch pass.
init_age_from_jira=1